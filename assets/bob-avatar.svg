<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Bob Botrage avatar">
  <title>Bob Botrage</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#141a33"/>
      <stop offset="1" stop-color="#1d1440"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#eafaff"/>
      <stop offset="0.35" stop-color="#5ad1ff"/>
      <stop offset="0.75" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#3320a8"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g stroke="#2b3566" stroke-width="2" opacity="0.5" fill="none">
    <path d="M60 150 H180 V90"/>
    <path d="M452 150 H332 V90"/>
    <path d="M60 362 H180 V422"/>
    <path d="M452 362 H332 V422"/>
    <circle cx="180" cy="90" r="5" fill="#2b3566" stroke="none"/>
    <circle cx="332" cy="90" r="5" fill="#2b3566" stroke="none"/>
    <circle cx="180" cy="422" r="5" fill="#2b3566" stroke="none"/>
    <circle cx="332" cy="422" r="5" fill="#2b3566" stroke="none"/>
  </g>

  <g fill="url(#ring)" opacity="0.9">
    <g transform="translate(256 90) rotate(45)"><rect x="-16" y="-16" width="32" height="32" rx="6"/></g>
    <g transform="translate(422 256) rotate(45)"><rect x="-16" y="-16" width="32" height="32" rx="6"/></g>
    <g transform="translate(256 422) rotate(45)"><rect x="-13" y="-13" width="26" height="26" rx="5"/></g>
    <g transform="translate(90 256) rotate(45)"><rect x="-13" y="-13" width="26" height="26" rx="5"/></g>
  </g>
  <g stroke="url(#ring)" stroke-width="3" fill="none" opacity="0.45">
    <circle cx="256" cy="256" r="166"/>
  </g>

  <g filter="url(#glow)">
    <g transform="translate(256 256) rotate(45)">
      <rect x="-96" y="-96" width="192" height="192" rx="30" fill="url(#core)"/>
    </g>
  </g>

  <text x="256" y="258" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="700"
        fill="#0b1020" opacity="0.92">B</text>

  <circle cx="332" cy="180" r="9" fill="#eafaff" filter="url(#glow)"/>
</svg>
